[workspace]
resolver = "2"
members = [
  "crates/helper-contracts",
  "crates/helper-core",
  "crates/helper-store",
  "crates/helper-discord",
  "crates/helper-api",
  "crates/helper-modules",
  "crates/helper-runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "Proprietary"
authors = ["Vozen"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
quick-xml = "0.41"
http = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
k256 = { version = "0.14", features = ["ecdsa"] }
libc = "0.2"
# Serenity 0.12.5 still pins tokio-rustls 0.25/rustls 0.22, whose
# rustls-webpki 0.102 line has no patched release for the current advisories.
# Use the VPS OS TLS backend for the Discord transport; the Helper API keeps
# reqwest's current rustls 0.23 backend independently.
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }
sha2 = "0.10"
sha3 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v4"] }
