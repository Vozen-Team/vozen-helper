name: Rust Helper release

on:
  workflow_dispatch:
  push:
    branches:
      - migration/helper-rust-public
      - migration/helper-rust-public-secure

permissions:
  contents: write

concurrency:
  group: helper-rust-release
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private reply catalogues
        run: node tools/private-reply-sources.mjs --check
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install achievement card fonts
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        env:
          HELPER_LEVEL_CARD_PREVIEW: ${{ github.workspace }}/level-up-default.png
          HELPER_ACHIEVEMENT_UNLOCK_PREVIEW: ${{ github.workspace }}/achievement-unlocked.png
          HELPER_ACHIEVEMENTS_PREVIEW: ${{ github.workspace }}/achievements.png
        run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: level-up-preview-${{ github.sha }}
          path: |
            level-up-default.png
            achievements.png
            achievement-unlocked*.png
          if-no-files-found: error
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release -p helper-runtime
      - name: Package
        run: |
          mkdir -p release/bin release/deploy
          cp target/release/vozen-helper release/bin/vozen-helper
          cp deploy/vozen-helper-rust.service release/deploy/
          cp deploy/ROLLBACK.md release/deploy/
          tar -czf vozen-helper-rust-${GITHUB_SHA}.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: vozen-helper-rust-linux-${{ github.sha }}
          path: vozen-helper-rust-${{ github.sha }}.tar.gz
          if-no-files-found: error
      - name: Publish versioned release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="helper-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "vozen-helper-rust-${GITHUB_SHA}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "vozen-helper-rust-${GITHUB_SHA}.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Vozen Helper ${GITHUB_SHA}" \
              --notes "CI-validated Linux release for commit ${GITHUB_SHA}."
          fi
