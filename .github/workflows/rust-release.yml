name: Rust Helper release

on:
  workflow_dispatch:
  push:
    branches:
      - migration/helper-rust-public
      - migration/helper-rust-public-secure

permissions:
  contents: write
  actions: read

concurrency:
  group: helper-rust-release
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate private reply catalogues
        run: node tools/private-reply-sources.mjs --check
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install achievement card fonts
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends fonts-noto-cjk fonts-noto-core
      - name: Test backup verifier safety
        run: python3 -m unittest discover -s tests -p 'test_verify_backup.py' -v
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        env:
          HELPER_LEVEL_CARD_PREVIEW: ${{ github.workspace }}/level-up-default.png
          HELPER_ACHIEVEMENT_UNLOCK_PREVIEW: ${{ github.workspace }}/achievement-unlocked.png
          HELPER_ACHIEVEMENTS_PREVIEW: ${{ github.workspace }}/achievements.png
        run: cargo test --workspace
      - name: Require complete CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --commit "$GITHUB_SHA" --limit 100 --json databaseId,headSha,headBranch,event > "$RUNNER_TEMP/helper-ci.json"
          run_id=$(python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/helper-ci.json') as stream:
              runs = json.load(stream)
          matches = [run for run in runs if run['headSha'] == os.environ['GITHUB_SHA']
                     and run['headBranch'] == os.environ['GITHUB_REF_NAME'] and run['event'] == 'push']
          assert matches, 'No push CI exists for this exact revision and branch'
          print(max(matches, key=lambda run: run['databaseId'])['databaseId'])
          PY
          )
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json headSha,headBranch,event,conclusion > "$RUNNER_TEMP/helper-ci-result.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/helper-ci-result.json') as stream:
              run = json.load(stream)
          assert run == dict(headSha=os.environ['GITHUB_SHA'], headBranch=os.environ['GITHUB_REF_NAME'],
                             event='push', conclusion='success'), 'Exact revision CI did not pass'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: level-up-preview-${{ github.sha }}
          path: |
            level-up-default.png
            achievements.png
            achievement-unlocked*.png
          if-no-files-found: error
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release -p helper-runtime
      - name: Package
        run: |
          mkdir -p release/bin release/deploy
          cp target/release/vozen-helper release/bin/vozen-helper
          cp deploy/vozen-helper-rust.service release/deploy/
          cp deploy/ROLLBACK.md release/deploy/
          cp deploy/verify-backup.py release/deploy/
          tar -czf vozen-helper-rust-${GITHUB_SHA}.tar.gz -C release .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vozen-helper-rust-linux-${{ github.sha }}
          path: vozen-helper-rust-${{ github.sha }}.tar.gz
          if-no-files-found: error
      - name: Publish versioned release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="helper-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "vozen-helper-rust-${GITHUB_SHA}.tar.gz" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "vozen-helper-rust-${GITHUB_SHA}.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Vozen Helper ${GITHUB_SHA}" \
              --notes "CI-validated Linux release for commit ${GITHUB_SHA}."
          fi
