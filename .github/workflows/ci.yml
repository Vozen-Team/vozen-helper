name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate systemd resource controls
        run: |
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' deploy/vozen-helper-rust.service > /tmp/helper-security.service
          systemd-analyze verify --man=no /tmp/helper-security.service
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            panel/package-lock.json
      - name: Install npm dependencies
        run: npm ci --no-audit --prefer-offline
      - name: Validate private reply catalogues
        run: node tools/private-reply-sources.mjs --check
      - name: Audit npm dependencies
        run: node tools/npm-audit-ci.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install dashboard panel
        working-directory: panel
        run: npm ci --ignore-scripts --no-audit
      - name: Audit dashboard panel
        working-directory: panel
        run: node ../tools/npm-audit-ci.mjs
      - name: Build dashboard panel
        working-directory: panel
        run: npm run build
