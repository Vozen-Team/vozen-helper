name: Helper retention checks
on:
  push:
    paths: ['deploy/retention/**', '.github/workflows/helper-retention-checks.yml']
  pull_request:
    paths: ['deploy/retention/**', '.github/workflows/helper-retention-checks.yml']
permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s deploy/retention -p 'test_*.py' -v
